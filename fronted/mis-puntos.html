<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Puntos — Lobby Zone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e2e2e2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #e91e8c;
            margin-bottom: 24px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 16px;
        }

        .nombre {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .apodo {
            color: #555;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .codigo {
            font-size: 11px;
            color: #333;
        }

        .puntos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .pts-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .pts-label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .pts-valor {
            font-size: 32px;
            font-weight: 800;
        }

        .pts-juego   { color: #f59e0b; }
        .pts-consumo { color: #60a5fa; }

        .pts-sub {
            font-size: 11px;
            color: #555;
            margin-top: 4px;
        }

        .ranking-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1a1a0a;
            border: 1px solid #f59e0b44;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 13px;
            color: #f59e0b;
            margin-top: 8px;
        }

        .info-box {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1a1a1a;
        }

        .hist-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #111;
            font-size: 13px;
        }

        .hist-tipo {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .tipo-juego   { background: #1a1500; color: #f59e0b; }
        .tipo-consumo { background: #0a1020; color: #60a5fa; }

        .hist-pts { font-weight: 700; }
        .hist-motivo { color: #555; font-size: 11px; }
        .hist-fecha  { color: #333; font-size: 11px; }

        .error { text-align: center; color: #ef4444; padding: 40px 0; }
        .loader { text-align: center; color: #555; padding: 60px 0; font-size: 14px; }
    </style>
</head>
<body>

<div class="logo">🎮 LOBBY ZONE</div>

<div id="contenido" class="loader">Cargando tu perfil...</div>

<script>
    const API = window.location.origin + "/api";

    function fmtFecha(f) {
        if (!f) return "—";
        const d = new Date(f);
        return d.toLocaleDateString("es-GT", { day:"2-digit", month:"short", year:"numeric" });
    }

    function fmtPts(n) {
        return parseFloat(n || 0).toFixed(2).replace(/\.00$/, "");
    }

    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("codigo");

    if (!codigo) {
        document.getElementById("contenido").innerHTML =
            `<p class="error">❌ Código de cliente no encontrado.<br>Escanea tu QR personal.</p>`;
    } else {
        fetch(`${API}/publico/cliente/${encodeURIComponent(codigo)}`, {
            headers: { "ngrok-skip-browser-warning": "true" }
        })
        .then(r => {
            if (!r.ok) throw new Error("no encontrado");
            return r.json();
        })
        .then(data => {
            const posStr = data.posicion_ranking
                ? `<div class="ranking-badge">🏆 Posición #${data.posicion_ranking} en el ranking</div>`
                : "";

            const histHTML = (data.historial || []).length === 0
                ? `<p style="color:#333;font-size:13px;text-align:center;padding:12px 0;">Sin movimientos aún.</p>`
                : data.historial.map(h => `
                    <div class="hist-fila">
                        <div>
                            <span class="hist-tipo ${h.tipo === 'JUEGO' ? 'tipo-juego' : 'tipo-consumo'}">${h.tipo}</span>
                            <span class="hist-motivo" style="margin-left:6px;">${h.motivo || ""}</span>
                        </div>
                        <div style="text-align:right;">
                            <span class="hist-pts ${h.tipo === 'JUEGO' ? 'pts-juego' : 'pts-consumo'}">+${fmtPts(h.puntos)}</span>
                            <div class="hist-fecha">${fmtFecha(h.fecha)}</div>
                        </div>
                    </div>`).join("");

            document.getElementById("contenido").innerHTML = `
                <div class="card">
                    <p class="nombre">${data.nombre || "—"}</p>
                    ${data.apodo ? `<p class="apodo">🎮 ${data.apodo}</p>` : ""}
                    <p class="codigo">${data.codigo}</p>
                    ${posStr}
                </div>

                <div class="puntos-grid" style="width:100%;max-width:420px;">
                    <div class="pts-card">
                        <p class="pts-label">Puntos de juego</p>
                        <p class="pts-valor pts-juego">${fmtPts(data.puntos_juego)}</p>
                        <p class="pts-sub">Cuentan para el Top 10</p>
                    </div>
                    <div class="pts-card">
                        <p class="pts-label">Puntos consumo</p>
                        <p class="pts-valor pts-consumo">${fmtPts(data.puntos_consumo)}</p>
                        <p class="pts-sub">1 pto = Q1 en comida</p>
                    </div>
                </div>

                <div class="card">
                    <div class="info-box">
                        💡 Los puntos de <strong style="color:#f59e0b;">juego</strong> se ganan jugando en consola (5 pts/hora) y en torneos.<br>
                        Los puntos de <strong style="color:#60a5fa;">consumo</strong> se ganan comprando comida (0.05 pts/Q) y se canjean por Q1 cada uno.
                    </div>
                    <h3>📋 Últimos movimientos</h3>
                    ${histHTML}
                </div>
            `;
        })
        .catch(() => {
            document.getElementById("contenido").innerHTML =
                `<p class="error">❌ No se encontró tu perfil.<br>Verifica tu código QR.</p>`;
        });
    }
</script>
</body>
</html>
